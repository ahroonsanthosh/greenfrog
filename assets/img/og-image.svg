<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Nectar Coffee House, Cork">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF6ED"/>
      <stop offset="1" stop-color="#F2E3D2"/>
    </linearGradient>
    <filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.04"/></feComponentTransfer></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#g)"/>
  <circle cx="980" cy="120" r="150" fill="#9CC9B7" opacity="0.55"/>
  <circle cx="1120" cy="520" r="120" fill="#F4C430" opacity="0.5"/>
  <circle cx="120" cy="540" r="120" fill="#E8685A" opacity="0.25"/>
  <rect width="1200" height="630" filter="url(#n)"/>
  <g transform="translate(90,250)">
    <rect x="0" y="-92" width="300" height="80" rx="40" fill="#E8685A"/>
    <text x="150" y="-34" text-anchor="middle" font-family="'Baloo 2','Trebuchet MS',sans-serif" font-size="56" font-weight="800" fill="#FBF6ED">nectar</text>
    <text x="2" y="70" font-family="'Plus Jakarta Sans','Segoe UI',sans-serif" font-size="58" font-weight="800" fill="#1F2A48">Coffee House · Cork</text>
    <text x="4" y="128" font-family="'Plus Jakarta Sans','Segoe UI',sans-serif" font-size="30" font-weight="600" fill="#5A5048" letter-spacing="2">COFFEE · SMOOTHIES · ICE CREAM</text>
    <text x="4" y="178" font-family="'Plus Jakarta Sans','Segoe UI',sans-serif" font-size="24" font-weight="500" fill="#7A6E63">26 Parnell Place · Open 7 days</text>
  </g>
</svg>
